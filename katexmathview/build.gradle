plugins {
    id 'com.vanniktech.maven.publish' version '0.33.0'
}

import com.vanniktech.maven.publish.AndroidSingleVariantLibrary

apply plugin: 'com.android.library'
// AGP 9.0+ auto-applies Kotlin support ("built-in Kotlin"); an explicit kotlin-android
// apply now conflicts with it (duplicate 'kotlin' extension registration).

android {
    namespace = "katex.hourglass.in.mathlib"
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
        versionCode libs.versions.libraryVersionCode.get().toInteger()
        versionName libs.versions.libraryVersionName.get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // kotlinOptions {} is gone under AGP's built-in Kotlin support; jvmTarget now infers
    // from compileOptions.targetCompatibility above (1.8), so no replacement block is needed.
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.ext.junit
    implementation libs.androidx.appcompat
    implementation libs.androidx.core
    testImplementation libs.junit
}

mavenPublishing {
    configure(new AndroidSingleVariantLibrary("release", true, true))

    coordinates("io.github.lingarajsankaravelu", "katexmathview", libs.versions.libraryVersionName.get())

    pom {
        name = "KatexMathView"
        description = "A custom WebView to render math formulas using KaTeX"
        inceptionYear = "2019"
        url = "https://github.com/lingarajsankaravelu/Katex"
        licenses {
            license {
                name = "The Apache License, Version 2.0"
                url = "http://www.apache.org/licenses/LICENSE-2.0.txt"
                distribution = "http://www.apache.org/licenses/LICENSE-2.0.txt"
            }
        }
        developers {
            developer {
                id = "lingarajsankaravelu"
                name = "S Lingaraj"
                url = "https://github.com/lingarajsankaravelu"
            }
        }
        scm {
            url = "https://github.com/lingarajsankaravelu/Katex"
            connection = "scm:git:git://github.com/lingarajsankaravelu/Katex.git"
            developerConnection = "scm:git:ssh://git@github.com/lingarajsankaravelu/Katex.git"
        }
    }

    publishToMavenCentral()
    signAllPublications()
}

