name: Release katexmathview to Maven Central

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version and guard against re-releasing
        run: |
          set -euo pipefail
          NEW_VERSION=$(grep -m1 '^libraryVersionName' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')

          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::libraryVersionName '$NEW_VERSION' in gradle/libs.versions.toml isn't in x.y.z form."
            exit 1
          fi

          if git rev-parse "v_$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v_$NEW_VERSION already exists — gradle/libs.versions.toml's libraryVersionName ($NEW_VERSION) hasn't been bumped since the last release. Bump libraryVersionName on master before running this workflow."
            exit 1
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      - name: Build changelog since previous release
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git tag -l 'v_*' --sort=-v:refname | head -1)

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous tag: $PREVIOUS_TAG"
            LOG_RANGE="$PREVIOUS_TAG..HEAD"
          else
            echo "No previous v_* tag found; using full history."
            LOG_RANGE="HEAD"
          fi

          {
            echo "CHANGELOG<<EOF"
            git log $LOG_RANGE --pretty=format:"- %s (%h)"
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Tag release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v_$NEW_VERSION" -m "$CHANGELOG"
          git push origin "v_$NEW_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify build
        run: ./gradlew clean assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --console=plain --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./gradlew :katexmathview:publishAndReleaseToMavenCentral --no-configuration-cache --console=plain --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$CHANGELOG" > /tmp/release-notes.md
          gh release create "v_$NEW_VERSION" \
            --title "v_$NEW_VERSION" \
            --notes-file /tmp/release-notes.md
