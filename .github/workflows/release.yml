name: Release katexmathview to Maven Central

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.4) — must be greater than the currently published version'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: maven-central-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version is newer than what's currently published
        run: |
          set -euo pipefail
          NEW_VERSION="${{ inputs.version }}"
          CURRENT_VERSION=$(grep -m1 '^libraryVersionName' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')

          if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$NEW_VERSION' isn't in x.y.z form."
            exit 1
          fi

          HIGHEST=$(printf '%s\n%s\n' "$CURRENT_VERSION" "$NEW_VERSION" | sort -V | tail -1)
          if [ "$NEW_VERSION" = "$CURRENT_VERSION" ] || [ "$HIGHEST" != "$NEW_VERSION" ]; then
            echo "::error::Version $NEW_VERSION is not newer than the current version $CURRENT_VERSION (gradle/libs.versions.toml). Publishing the same or an older version would not overwrite what's already on Maven Central — it would just fail, or be silently skipped. Enter a higher version."
            exit 1
          fi

          if git rev-parse "v_$NEW_VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v_$NEW_VERSION already exists."
            exit 1
          fi

          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> "$GITHUB_ENV"

      - name: Build changelog since previous release
        run: |
          set -euo pipefail
          PREVIOUS_TAG=$(git tag -l 'v_*' --sort=-v:refname | head -1)

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "Previous tag: $PREVIOUS_TAG"
            LOG_RANGE="$PREVIOUS_TAG..HEAD"
          else
            echo "No previous v_* tag found; using full history."
            LOG_RANGE="HEAD"
          fi

          {
            echo "CHANGELOG<<EOF"
            git log $LOG_RANGE --pretty=format:"- %s (%h)"
            echo ""
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Bump version in gradle/libs.versions.toml
        run: |
          set -euo pipefail
          CURRENT_CODE=$(grep -m1 '^libraryVersionCode' gradle/libs.versions.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NEW_CODE=$((CURRENT_CODE + 1))

          sed -i "s/^libraryVersionName = \".*\"/libraryVersionName = \"$NEW_VERSION\"/" gradle/libs.versions.toml
          sed -i "s/^libraryVersionCode = \".*\"/libraryVersionCode = \"$NEW_CODE\"/" gradle/libs.versions.toml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/libs.versions.toml
          git commit -m "Release katexmathview $NEW_VERSION"

      - name: Tag release
        run: |
          set -euo pipefail
          git tag -a "v_$NEW_VERSION" -m "$CHANGELOG"

      - name: Push commit and tag
        run: |
          set -euo pipefail
          git checkout -B "${GITHUB_REF_NAME}"
          git push origin "${GITHUB_REF_NAME}"
          git push origin "v_$NEW_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify build
        run: ./gradlew clean assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug --console=plain --stacktrace

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: ./gradlew :katexmathview:publishAndReleaseToMavenCentral --no-configuration-cache --console=plain --stacktrace

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$CHANGELOG" > /tmp/release-notes.md
          gh release create "v_$NEW_VERSION" \
            --title "v_$NEW_VERSION" \
            --notes-file /tmp/release-notes.md
