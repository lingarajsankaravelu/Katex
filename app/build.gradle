apply plugin: 'com.android.application'
// AGP 9.0+ auto-applies Kotlin support ("built-in Kotlin"); an explicit kotlin-android
// apply now conflicts with it (duplicate 'kotlin' extension registration).

android {
    namespace = "hourglass.github.in.katex"
    compileSdkVersion libs.versions.compileSdk.get().toInteger()
    defaultConfig {
        applicationId "hourglass.github.in.katex"
        minSdkVersion libs.versions.minSdk.get().toInteger()
        targetSdkVersion libs.versions.targetSdk.get().toInteger()
        versionCode libs.versions.libraryVersionCode.get().toInteger()
        versionName libs.versions.libraryVersionName.get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // kotlinOptions {} is gone under AGP's built-in Kotlin support; jvmTarget now infers
    // from compileOptions.targetCompatibility above (1.8), so no replacement block is needed.
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    androidTestImplementation libs.androidx.test.espresso.core
    androidTestImplementation libs.androidx.test.ext.junit
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.material
    testImplementation libs.junit
    implementation project(':katexmathview')
}
